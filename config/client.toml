socks5_listen = "0.0.0.0:1080"
http_listen = "0.0.0.0:8080"
server_addr = "127.0.0.1:12345"
server_name = "stunnel"
server_cert = "stunnel_cert.pem"
private_key = "private_key.pem"

# tlstcp or quic or s2n-quic
tunnel_type = "tlstcp"

# quic and s2n-quic
# reverse proxy: server listens on `listen`, each connection is forwarded
# through the tunnel to the client-side `target`. Multiple entries supported.
# reverse_proxy = [
#     { listen = "0.0.0.0:8081", target = "127.0.0.1:3000" },
#     { listen = "0.0.0.0:8082", target = "127.0.0.1:22" },
# ]

# quic config
# quic = { cc = "bbr|fixed", loss_threshold = 20, fixed_bandwidth = 6000000 }

# metrics: counters, gauges and histograms over OTLP/HTTP. Without `otel`, or
# with an empty endpoint, nothing is exported. `service_name` defaults to
# stunnel-client. `service.instance.id` is the device's outbound IP (the source
# address for the default route); uncomment `instance_id` to override it (for
# example in a container whose IP is not the device's IP).
otel = { endpoint = "http://10.0.0.36:4318", service_name = "stunnel-client", export_interval_secs = 15 }
# otel = { endpoint = "http://10.0.0.36:4318", protocol = "http-json",
#          service_name = "stunnel-client", instance_id = "10.0.0.80",
#          export_interval_secs = 15, headers = { authorization = "Bearer ..." } }

# logging to the ULS on macOS
# macos_logging = { enable = false, subsystem = "stunnel" }
